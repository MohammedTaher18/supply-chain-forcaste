version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./supply_chain_forecast:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./supply_chain_forecast:/app
    command: streamlit run dashboard/app.py --server.port 8501
    depends_on:
      - api